# deploy.yml: publishes the site to https://civicaiclub.github.io whenever main changes.
#
# In plain words: when a pull request is merged into main, GitHub builds the site with Astro's
# official action (which reads the Node version below and installs from package-lock.json), then
# hands the finished files to GitHub Pages.
# One-time setup in the repository's Settings > Pages: set "Source" to "GitHub Actions".
# There is no "base" path: this is the organization's main Pages site.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permission to publish to Pages, and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer one waits for the running one to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Build with Astro and upload for Pages
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
